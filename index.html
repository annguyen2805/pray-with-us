
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pray with God</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Serif+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background-color: #fdfcfb;
        overflow: hidden;
        height: 100vh;
        color: #2d2d2d;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
        letter-spacing: -0.01em;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      /* Dark mode (Night theme) - Professional Black Theme */
      body.night-theme {
        background-color: #000000;
        color: #f8fafc;
      }
      
      body.night-theme .glass {
        background: rgba(15, 15, 15, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      
      body.night-theme .divine-glow {
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.05), 0 0 80px rgba(255, 255, 255, 0.02);
      }
      
      body.night-theme .divine-glow-aura {
        box-shadow: 0 0 50px rgba(255, 255, 255, 0.08), 0 0 100px rgba(255, 255, 255, 0.03);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
      }
      
      body.night-theme .lumina-gradient {
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        box-shadow: 0 4px 20px rgba(30, 41, 59, 0.3);
      }
      
      body.night-theme .shimmer-text {
        background: linear-gradient(90deg, #e2e8f0, #cbd5e1, #e2e8f0);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer-text 5s linear infinite;
      }
      
      /* Professional dark mode text colors */
      body.night-theme h1,
      body.night-theme h2,
      body.night-theme h3,
      body.night-theme h4,
      body.night-theme h5,
      body.night-theme h6 {
        color: #f8fafc;
      }
      
      body.night-theme p,
      body.night-theme span,
      body.night-theme div {
        color: #e2e8f0;
      }
      
      /* Professional dark mode input and form elements */
      body.night-theme input,
      body.night-theme textarea {
        background-color: #0a0a0a !important;
        color: #f8fafc !important;
        border-color: rgba(255, 255, 255, 0.1) !important;
      }
      
      body.night-theme input:focus,
      body.night-theme textarea:focus {
        border-color: rgba(255, 255, 255, 0.2) !important;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05) !important;
      }
      
      body.night-theme input::placeholder,
      body.night-theme textarea::placeholder {
        color: #64748b !important;
      }
      
      /* Professional dark mode text color overrides */
      body.night-theme .text-slate-800,
      body.night-theme .text-slate-900,
      body.night-theme .text-amber-950 {
        color: #f8fafc !important;
      }
      
      body.night-theme .text-slate-700 {
        color: #e2e8f0 !important;
      }
      
      body.night-theme .text-slate-500,
      body.night-theme .text-slate-400 {
        color: #94a3b8 !important;
      }
      
      body.night-theme .text-slate-300 {
        color: #64748b !important;
      }
      
      /* Professional dark mode backgrounds */
      body.night-theme .bg-white {
        background-color: #0a0a0a !important;
      }
      
      body.night-theme .bg-slate-50,
      body.night-theme .bg-slate-100 {
        background-color: #0f0f0f !important;
      }
      
      body.night-theme .bg-amber-50 {
        background-color: rgba(30, 41, 59, 0.3) !important;
      }
      
      /* Professional dark mode borders */
      body.night-theme .border-white,
      body.night-theme .border-amber-900\/10 {
        border-color: rgba(255, 255, 255, 0.08) !important;
      }
      
      body.night-theme .border-amber-900\/5 {
        border-color: rgba(255, 255, 255, 0.05) !important;
      }
      
      /* Professional dark mode shadows */
      body.night-theme .shadow-sm,
      body.night-theme .shadow-md,
      body.night-theme .shadow-lg {
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5) !important;
      }
      
      body.night-theme .shadow-xl {
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6) !important;
      }
      
      /* Professional dark mode buttons */
      body.night-theme button.lumina-gradient {
        background: linear-gradient(135deg, #334155 0%, #475569 100%);
        color: #f8fafc;
        box-shadow: 0 4px 20px rgba(51, 65, 85, 0.4);
      }
      
      body.night-theme button.lumina-gradient:hover {
        background: linear-gradient(135deg, #475569 0%, #64748b 100%);
        box-shadow: 0 6px 24px rgba(51, 65, 85, 0.5);
      }
      
      /* Professional dark mode scrollbar */
      body.night-theme ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
      }
      
      body.night-theme ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.3);
      }
      
      .font-serif-display { 
        font-family: 'Noto Serif Display', 'Playfair Display', Georgia, serif;
        font-weight: 500;
        letter-spacing: -0.02em;
      }

      .font-prayer { 
        font-family: 'Noto Serif Display', 'Playfair Display', Georgia, serif;
        line-height: 1.7 !important;
        letter-spacing: -0.01em;
        font-weight: 400;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      
      .divine-glow {
        box-shadow: 0 0 30px rgba(180, 83, 9, 0.08);
      }

      .divine-glow-aura {
        box-shadow: 0 0 40px rgba(180, 83, 9, 0.15), 0 0 80px rgba(245, 158, 11, 0.05);
        border: 1.5px solid rgba(180, 83, 9, 0.2);
        animation: aura-pulse 3s infinite ease-in-out;
      }

      @keyframes aura-pulse {
        0%, 100% { box-shadow: 0 0 40px rgba(180, 83, 9, 0.15), 0 0 80px rgba(245, 158, 11, 0.05); }
        50% { box-shadow: 0 0 60px rgba(180, 83, 9, 0.3), 0 0 100px rgba(245, 158, 11, 0.1); }
      }

      .lumina-gradient {
        background: linear-gradient(135deg, #7c2d12 0%, #b45309 100%);
      }

      .shimmer-text {
        background: linear-gradient(90deg, #7c2d12, #f59e0b, #7c2d12);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer-text 5s linear infinite;
      }
      @keyframes shimmer-text {
        to { background-position: 200% center; }
      }

      .divine-pulse {
        animation: divine-pulse 2.5s infinite ease-in-out;
      }
      @keyframes divine-pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; filter: drop-shadow(0 0 5px rgba(124,45,18,0.2)); }
        50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 20px rgba(124,45,18,0.5)); }
      }

      .animate-spin-slow {
        animation: spin 3s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .animate-fadeIn {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-slideUp {
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .animate-bounce {
        animation: bounce 1.4s ease-in-out infinite;
      }

      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-thumb { background: rgba(180, 83, 9, 0.1); border-radius: 10px; }
      
      nav {
        padding-bottom: env(safe-area-inset-bottom, 24px);
      }

      .input-divine:focus-within {
        box-shadow: 0 0 20px rgba(180, 83, 9, 0.15);
        border-color: rgba(180, 83, 9, 0.3);
      }

      /* Chat message text wrapping */
      .chat-message {
        word-break: break-word !important;
        overflow-wrap: break-word !important;
        white-space: pre-wrap !important;
        overflow: visible !important;
        display: block !important;
        max-width: 85% !important;
        width: auto !important;
        min-width: 0 !important;
        hyphens: auto !important;
      }
      
      /* Ensure chat container allows full text display */
      .chat-container {
        overflow: visible !important;
        max-height: none !important;
        height: auto !important;
        flex-shrink: 0 !important;
      }
      
      /* Ensure chat message containers don't compress */
      .chat-container > div {
        flex-shrink: 0 !important;
        min-height: auto !important;
      }
      
      .chat-container > div > div {
        flex-shrink: 0 !important;
        min-height: auto !important;
        overflow: visible !important;
        max-height: none !important;
      }
    </style>
  <script type="importmap">

</script>
